name: Validate Memoir Recorder
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
# Distribution runs from the signing Mac using scripts/notarize-release.sh and
# scripts/publish-release.sh. CI never publishes unsigned rolling builds.
